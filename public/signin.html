<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Sign In</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-4">
                    <div class="card-body">
                        <input type="text" id="signin-username" class="form-control" placeholder="Username">
                        <input type="password" id="signin-password" class="form-control mt-2" placeholder="Password">
                        <button class="btn btn-primary mt-3" onclick="signIn()">Sign In</button>
                        <a href="register.html" class="btn btn-link mt-3">Register</a>
                        <div id="signin-status" class="mt-2 text-danger"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function signIn() {
            const username = document.getElementById('signin-username').value;
            const password = document.getElementById('signin-password').value;
            const statusElement = document.getElementById('signin-status');

            if (!username || !password) {
                statusElement.textContent = "Please enter both username and password.";
                return;
            }

            fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.message || 'Invalid credentials');
                    });
                }
                return response.json();
            })
            .then(data => {
                statusElement.textContent = "Login successful! Redirecting...";
                statusElement.classList.remove('text-danger');
                statusElement.classList.add('text-success');
                // Redirect to games page after successful login
                window.location.href = '/games.html';
            })
            .catch(error => {
                statusElement.textContent = error.message;
                console.error('Login error:', error);
            });
        }

        // Add event listener for Enter key after the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('signin-password');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        signIn();
                    }
                });
            }
        });
    </script>
</body>
</html>
