<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function signIn() {
            const username = document.getElementById('signin-username').value;
            const password = document.getElementById('signin-password').value;
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const user = users.find(user => user.username === username && user.password === password);
            if (user) {
                alert('Sign in successful!');
                localStorage.setItem('signedInUser', username); // Store user session
                window.location.href = 'index.html'; // Redirect to games page
            } else {
                alert('Invalid credentials, please try again.');
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Sign In</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-4">
                    <div class="card-body">
                        <input type="text" id="signin-username" class="form-control" placeholder="Username">
                        <input type="password" id="signin-password" class="form-control mt-2" placeholder="Password">
                        <button class="btn btn-primary mt-3" onclick="signIn()">Sign In</button>
                        <a href="register.html" class="btn btn-link mt-3">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
