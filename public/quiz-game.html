<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefighter Quiz Game</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .quiz-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 20px;
        }
        .option {
            margin: 10px 0;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option:hover {
            background-color: #f8f9fa;
        }
        .option.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .option.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        .feedback {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }
        .score-display {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .progress {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body class="bg-light">
    <div class="quiz-container">
        <h1 class="text-center mb-4">Firefighter Knowledge Quiz</h1>
        <div class="score-display">Score: <span id="score">0</span></div>
        <div class="progress mb-4">
            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
        </div>
        <div id="quiz-content">
            <h3 id="question"></h3>
            <div id="options" class="mt-3"></div>
            <div id="feedback" class="feedback mt-3"></div>
            <button id="next-btn" class="btn btn-primary mt-3" style="display: none;">Next Question</button>
        </div>
        <div id="final-screen" style="display: none;" class="text-center">
            <h2>Quiz Complete!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the primary purpose of a fire extinguisher?",
                options: [
                    "To put out small fires",
                    "To break windows",
                    "To cool down rooms",
                    "To signal for help"
                ],
                correct: 0,
                explanation: "Fire extinguishers are designed to put out small fires or contain them until emergency services arrive."
            },
            {
                question: "What does PPE stand for in firefighting?",
                options: [
                    "Public Protection Equipment",
                    "Personal Protective Equipment",
                    "Primary Protection Ensemble",
                    "Professional Protection Equipment"
                ],
                correct: 1,
                explanation: "PPE stands for Personal Protective Equipment, which includes items like helmets, boots, and fire-resistant clothing."
            },
            {
                question: "What is the recommended way to exit a smoke-filled room?",
                options: [
                    "Run as fast as possible",
                    "Walk normally",
                    "Crawl low to the ground",
                    "Jump out the window"
                ],
                correct: 2,
                explanation: "Crawling low helps you avoid smoke inhalation as smoke rises to the ceiling."
            },
            {
                question: "Which of these is NOT a part of the fire triangle?",
                options: [
                    "Oxygen",
                    "Water",
                    "Heat",
                    "Fuel"
                ],
                correct: 1,
                explanation: "The fire triangle consists of Oxygen, Heat, and Fuel. Water is used to extinguish fires, not create them."
            },
            {
                question: "What color is a fire hydrant typically painted?",
                options: [
                    "Red",
                    "Green",
                    "Blue",
                    "Yellow"
                ],
                correct: 0,
                explanation: "Fire hydrants are typically painted red for high visibility, though colors may vary by location."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let questionAnswered = false;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const nextBtn = document.getElementById('next-btn');
        const finalScreen = document.getElementById('final-screen');
        const finalScoreEl = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const progressBar = document.getElementById('progress-bar');

        function showQuestion(index) {
            questionAnswered = false;
            const question = questions[index];
            questionEl.textContent = question.question;
            optionsEl.innerHTML = '';
            feedbackEl.style.display = 'none';
            nextBtn.style.display = 'none';

            question.options.forEach((option, i) => {
                const button = document.createElement('div');
                button.className = 'option';
                button.textContent = option;
                button.onclick = () => checkAnswer(i);
                optionsEl.appendChild(button);
            });

            updateProgress();
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            progressBar.style.width = progress + '%';
            progressBar.setAttribute('aria-valuenow', progress);
        }

        function checkAnswer(selectedIndex) {
            if (questionAnswered) return;
            questionAnswered = true;

            const question = questions[currentQuestion];
            const options = document.querySelectorAll('.option');

            options.forEach((option, i) => {
                if (i === question.correct) {
                    option.classList.add('correct');
                }
                if (i === selectedIndex && i !== question.correct) {
                    option.classList.add('incorrect');
                }
            });

            if (selectedIndex === question.correct) {
                score += 20;
                scoreEl.textContent = score;
                feedbackEl.className = 'feedback alert alert-success';
                feedbackEl.textContent = 'Correct! ' + question.explanation;
            } else {
                feedbackEl.className = 'feedback alert alert-danger';
                feedbackEl.textContent = 'Incorrect. ' + question.explanation;
            }

            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
        }

        function showFinalScreen() {
            document.getElementById('quiz-content').style.display = 'none';
            finalScreen.style.display = 'block';
            finalScoreEl.textContent = score;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            scoreEl.textContent = score;
            finalScreen.style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            showQuestion(0);
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion(currentQuestion);
            } else {
                showFinalScreen();
            }
        };

        restartBtn.onclick = restartQuiz;

        // Start the quiz
        showQuestion(0);
    </script>
</body>
</html>
